name: Build Super AI APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install "cython==0.29.36" buildozer
      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Super AI
          package.name = superai
          package.domain = com.superai.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          ls -lh buildozer.spec
      - name: Build APK
        run: |
          set +e
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android update || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea9b4eac" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license-old
          SDK_MGR=$(find $HOME/.buildozer -name sdkmanager -type f | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            echo "sdkmanager found: $SDK_MGR"
            yes | $SDK_MGR --licenses || true
            $SDK_MGR "build-tools;33.0.1" "platforms;android-33" "platform-tools" || true
          else
            echo "sdkmanager not yet found, continuing"
          fi
          set -e
          buildozer -v android debug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-ai-apk
          path: bin/*.apk
          if-no-files-found: warn
