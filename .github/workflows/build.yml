name: Build Super AI APK - FINAL
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Super AI
          package.name = superai
          package.domain = com.superai.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Docker
        run: |
          docker pull kivy/buildozer:master
          docker run --rm -v $PWD:/home/user/hostcwd -w /home/user/hostcwd kivy/buildozer:master bash -c "buildozer -v android debug"
          sudo chown -R $USER:$USER .
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-ai-apk
          path: bin/*.apk
          if-no-files-found: warn
