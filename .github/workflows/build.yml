name: Build Super AI APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-venv python3-pip openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          python3.10 --version
          java -version

      - name: Install buildozer
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install "cython==0.29.36" buildozer

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Super AI
          package.name = superai
          package.domain = com.superai.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cat buildozer.spec

      - name: Build APK
        run: |
          python3.10 -m buildozer android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-ai-apk
          path: bin/*.apk
          if-no-files-found: warn
