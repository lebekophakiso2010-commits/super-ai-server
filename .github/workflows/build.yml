name: Build Super AI APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3-pip openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install "cython==0.29.36" buildozer

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Super AI
          package.name = superai
          package.domain = com.superai.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,requests
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Fix Aidl - Install Build-Tools 37
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          python3.10 -m buildozer android update || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea9b4eac" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license-old
          SDK_MGR=$(find $HOME/.buildozer -name sdkmanager -type f | head -n1)
          echo "Installing Build-Tools 37.0.0 with $SDK_MGR"
          yes | $SDK_MGR --licenses || true
          $SDK_MGR --install "build-tools;37.0.0" "platforms;android-33" "platform-tools" || true
          ls -lh ~/.buildozer/android/platform/android-sdk/build-tools/
          ls -lh ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl || echo "aidl still missing"
          
      - name: Build APK
        run: |
          python3.10 -m buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-ai-apk
          path: bin/*.apk
          if-no-files-found: warn
